<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Project Pages</title>
  <style>
    body {
      align-items: center;
      background: #eef2f3;
      color: #1f2528;
      display: flex;
      font-family: Georgia, "Times New Roman", serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
    }

    main {
      max-width: 720px;
      padding: 3rem 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 500;
      line-height: 1.15;
      margin: 0 0 1rem;
    }

    p {
      color: #536067;
      font-family: Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      margin: 0 0 1.5rem;
    }

    a {
      border: 1px solid #9fb0b4;
      border-radius: 8px;
      color: #1f2528;
      display: inline-block;
      font-family: Arial, sans-serif;
      padding: 0.75rem 1rem;
      text-decoration: none;
    }

    a:hover {
      background: #dfe8ea;
    }
  </style>
</head>
<body>
  <main>
    <h1>Research Project Pages</h1>
    <p>Static pages deployed from this repository.</p>
    <a href="RoboticsForceProject/">Robotics Force Project</a>
  </main>
</body>
</html>
